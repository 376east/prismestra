<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Prismestra · Сцены, свет и экраны</title><link rel="stylesheet" href="ui.css"><link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="scene-file.css">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#library" aria-label="Prismestra, библиотека"><svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" stroke="none" d="M4 6H36L24 17ZM4 10L24 21L17 33ZM4 16L13 34H4Z"/></svg><span>prismestra</span></a>
  <nav aria-label="Основная навигация"><button data-view="library"></button><button data-view="editor"></button><button data-view="devices"></button></nav>
  <div class="sidebar-bottom"><button id="appearance-toggle" aria-label="Внешний вид" title="Внешний вид" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6h3m4 0h9M2 14h9m4 0h3"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg><span>Внешний вид</span></button></div>
</aside>

<dialog id="scene-file-dialog" aria-labelledby="scene-file-title">
  <h2 id="scene-file-title">Переносимая сцена</h2>
  <p>Предпросмотр файла сцены. Активный профиль редактируется отдельно.</p>
  <div class="scene-file-actions">
    <button class="button" id="scene-file-open">Открыть файл…</button>
    <button class="button primary" id="scene-file-save">Сохранить файл…</button>
  </div>
  <p id="scene-file-status" role="status"></p>
  <fieldset id="scene-file-controls">
    <div class="scene-file-layout">
      <div>
        <div class="scene-file-stage">
          <canvas id="scene-file-canvas" aria-label="Холст сцены"></canvas>
          <div id="scene-file-outline" aria-hidden="true" hidden></div>
        </div>
        <div class="scene-file-output-preview">
          <div><h3>LCD</h3><canvas id="scene-file-lcd" aria-label="Область LCD" hidden></canvas><p id="scene-file-lcd-note"></p></div>
          <div><h3>Лента</h3><canvas id="scene-file-strip" aria-label="Цвета кромок" hidden></canvas><p id="scene-file-strip-note"></p></div>
        </div>
      </div>
      <div class="scene-file-fields">
        <label for="scene-file-name">Название</label><input id="scene-file-name" type="text" maxlength="48">
        <h3>Слои</h3>
        <div id="scene-file-layers"></div>
        <button class="button" id="scene-file-add-color">Добавить цвет</button>
        <h3>Выходы</h3>
        <label for="scene-file-lcd-mode">LCD</label>
        <select id="scene-file-lcd-mode"><option value="off">Выключен</option><option value="full">Весь холст</option><option value="crop">Область холста</option></select>
        <div class="scene-file-region" id="scene-file-region" hidden>
          <label>Слева, % <input id="scene-file-x" type="number" min="0" max="99.99" step="0.01"></label>
          <label>Сверху, % <input id="scene-file-y" type="number" min="0" max="99.99" step="0.01"></label>
          <label>Ширина, % <input id="scene-file-width" type="number" min="0.01" max="100" step="0.01"></label>
          <label>Высота, % <input id="scene-file-height" type="number" min="0.01" max="100" step="0.01"></label>
        </div>
        <fieldset id="scene-file-edges">
          <legend>Кромки ленты</legend>
          <label><input type="checkbox" value="top"> Верх</label>
          <label><input type="checkbox" value="right"> Справа</label>
          <label><input type="checkbox" value="bottom"> Низ</label>
          <label><input type="checkbox" value="left"> Слева</label>
        </fieldset>
        <label class="native-group"><input id="scene-file-reverse" type="checkbox"> Развернуть обход</label>
      </div>
    </div>
  </fieldset>
  <div class="dialog-actions">
    <button class="button" id="scene-file-revert">Отменить правки</button>
    <button class="button" id="scene-file-close">Закрыть</button>
  </div>
</dialog>
<script src="scene-file.js"></script>
<div class="shell"><header class="topbar"><div class="project-context"><span>Локальный профиль</span><small>Prismestra</small></div><div class="breadcrumb" id="breadcrumb" hidden>Библиотека</div><span class="save-status" id="save-status">Подключение…</span></header><section id="native-error" class="notice" role="alert" hidden></section><main id="main"></main></div>
<footer class="player" aria-label="Воспроизведение сцены">
  <button class="player-scene" id="open-active" title="Открыть запущенную сцену"><canvas id="player-art" width="104" height="72"></canvas><span><strong id="player-name"></strong><small id="player-status"></small></span></button>
  <div class="transport"><button class="button" id="play">Выключить свет</button></div>
  <label class="master-brightness"><span id="sun-icon"></span><input id="master-brightness" type="range" min="0" max="100" aria-label="Яркость сцены (черновик)"><output id="master-value"></output></label><button class="button primary" id="footer-apply" disabled>Применить</button>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="name-dialog" aria-labelledby="dialog-title"><form id="name-form"><h2 id="dialog-title">Новая сцена</h2><label>Название<input id="scene-name" maxlength="48" required autocomplete="off"></label><p class="muted">Сцена сохраняет параметры RGB. Настройки устройств и LCD сохраняются отдельно в профиле.</p><div class="dialog-actions"><button type="button" id="cancel-name" class="button">Отмена</button><button type="submit" class="button primary">Сохранить</button></div></form></dialog>
<script src="app.js"></script><script src="theme.js"></script></body></html>
