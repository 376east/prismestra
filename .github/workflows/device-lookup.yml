name: Device lookup

on:
  pull_request:
    paths:
      - docs/devices/**
      - docs/site/**
      - src/ui/windows/web/assets/favicon.svg
      - resources/prismestra.ico
      - .github/workflows/device-lookup.yml
  push:
    branches: [master]
    paths:
      - docs/devices/**
      - docs/site/**
      - src/ui/windows/web/assets/favicon.svg
      - resources/prismestra.ico
      - .github/workflows/device-lookup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-lookup-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test docs/devices/lookup.test.mjs docs/site/setup-download.test.mjs
      - name: Prepare product site
        run: |
          mkdir -p _site/devices _site/shots/flipbook
          cp docs/site/{index.html,site.css,home.css,home.mjs,scene-preview.mjs,setup-download.mjs} _site/
          cp docs/site/shots/flipbook/*.webp _site/shots/flipbook/
          cp docs/site/site-icon.{png,svg} _site/
          cp src/ui/windows/web/assets/favicon.svg _site/
          cp resources/prismestra.ico _site/favicon.ico
          cp docs/devices/{index.html,lookup.css,lookup.mjs,catalog.mjs,openrgb-coverage.mjs,openrgb.json,prismestra.json} _site/devices/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/master'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
