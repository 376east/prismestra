name: HIDAPI reproducibility probe

on:
  pull_request:
    paths:
      - .github/workflows/hidapi-repro.yml
      - scripts/components/hidapi-repro/**

permissions:
  contents: read

jobs:
  hidapi-only:
    name: Production HIDAPI recipe on Windows 2022
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 37644dcb75fc6f8d491368f8adb4fb6462275eb2
      - name: Check the exact standalone recipe from PR 272
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -version '[17.0,18.0)' -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio 2022 x64 tools not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $archive = Join-Path $env:RUNNER_TEMP 'hidapi-238df449.zip'
          Invoke-WebRequest -Uri 'https://codeload.github.com/OpenRGBDevelopers/hidapi-hotplug/zip/238df449ecc0a56a70a3c8f4ebf46bb46857af27' -OutFile $archive
          $output = Join-Path $env:RUNNER_TEMP 'hidapi-hotplug.dll'
          python scripts/components/build_hidapi.py --archive $archive `
            --patch components/openrgb/hidapi-common-teardown.patch `
            --dependency-lock components/openrgb/dependency-lock.json `
            --work (Join-Path $env:RUNNER_TEMP 'hidapi-check') --vsdevcmd $devcmd --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath $output -Algorithm SHA256
