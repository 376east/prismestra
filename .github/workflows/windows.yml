name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the installer and lifecycle fixtures
        required: true
        default: v0.1.0-preview.6
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: Rust software checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release packaging boundaries
        run: python scripts/test_package_release.py
      - name: Check installer packaging boundaries
        run: python scripts/test_package_installer.py
      - name: Check legacy startup retirement without system changes
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/installer/test_legacy_startup.ps1
      - name: Check portable launchers without hardware
        run: python scripts/test_portable_launcher.py
      - name: Check local backend configuration without hardware
        run: python scripts/test_backend_setup.py
      - name: Check helper clock contract without hardware
        run: python scripts/test_helper_clock.py
      - name: Check component inventory gates without executing hardware code
        run: python scripts/components/test_verify_openrgb_component.py
      - name: Check component packaging without executing binaries
        run: python scripts/components/test_package_openrgb_component.py
      - name: Check embedded editor commands
        run: |
          node --check src/ui/windows/web/app.js
          node tests/native_ui_ipc.cjs
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test without physical devices
        run: cargo test --locked -- --test-threads=1
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  installer:
    name: Isolated installer lifecycle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Package offline Windows setup'))
    runs-on: windows-latest
    timeout-minutes: 15
    # GitHub requires push access to read an unpublished draft release.
    # Runs only on the packaging push or an authorized manual dispatch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and verify release fixtures
        id: fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0-preview.6' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { throw 'A release tag is required' }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Invalid release tag' }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern installer-lifecycle-inputs.zip --dir fixture -- $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Candidate lifecycle fixtures unavailable' }
          Expand-Archive -LiteralPath fixture/installer-lifecycle-inputs.zip -DestinationPath fixture/inputs
          $metadata = Get-Content -LiteralPath fixture/inputs/test.json -Raw | ConvertFrom-Json
          if ($metadata.commit -isnot [string] -or $metadata.commit -cnotmatch '^[0-9a-f]{40}$' -or
              $metadata.commit -cne $env:GITHUB_SHA) {
            throw 'Lifecycle fixture commit differs from the workflow checkout commit'
          }
          if ($metadata.namespace -isnot [string] -or
              $metadata.namespace -cnotmatch '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$') {
            throw 'Lifecycle fixture does not specify an isolated namespace'
          }
          foreach ($build in 'first', 'upgrade') {
            $manifest = Get-Content -LiteralPath "fixture/inputs/$build/stage/payload/install-manifest.json" -Raw | ConvertFrom-Json
            if ($manifest.commit -cne $env:GITHUB_SHA -or $manifest.data_namespace -cne $metadata.namespace) {
              throw "Lifecycle $build manifest does not match its fixture commit and namespace"
            }
          }
          $asset = $metadata.production_asset
          if (-not $asset -and $env:RELEASE_TAG -ceq 'v0.1.0-preview.5') {
            $asset = 'Prismestra-Setup-0.1.0.5-x64.exe'
          }
          if ($asset -isnot [string] -or $asset -cnotmatch '^Prismestra-Setup-[0-9]+(?:\.[0-9]+){2,3}-x64\.exe$' -or
              $metadata.production_sha256 -isnot [string] -or $metadata.production_sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Lifecycle fixture does not pin a valid offline installer asset'
          }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern $asset --dir fixture -- $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Candidate offline setup unavailable' }
          $installer = Join-Path fixture $asset
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant() -cne $metadata.production_sha256) {
            throw 'Offline setup SHA-256 differs from the fixture pin'
          }
          "production_asset=$asset" >> $env:GITHUB_OUTPUT
          "production_sha256=$($metadata.production_sha256)" >> $env:GITHUB_OUTPUT
      - name: Exercise the full offline installer
        shell: pwsh
        env:
          PRODUCTION_ASSET: ${{ steps.fixtures.outputs.production_asset }}
          PRODUCTION_SHA256: ${{ steps.fixtures.outputs.production_sha256 }}
        run: |
          ./scripts/installer/test_offline_setup.ps1 -Installer (Join-Path fixture $env:PRODUCTION_ASSET) -Sha256 $env:PRODUCTION_SHA256 -ReportDirectory offline-setup-result -DisposableRunner
      - name: Exercise installation, repair, upgrade and uninstall
        if: always() && steps.fixtures.outcome == 'success'
        shell: pwsh
        run: |
          $metadata = Get-Content fixture/inputs/test.json -Raw | ConvertFrom-Json
          ./scripts/installer/test_lifecycle.ps1 -Namespace $metadata.namespace -FirstBuild fixture/inputs/first -UpgradeBuild fixture/inputs/upgrade -ReportDirectory lifecycle-result -ElevatedFilesOnly
      - name: Exercise a fresh standard Windows account
        if: always() && steps.fixtures.outcome == 'success'
        shell: pwsh
        run: |
          $metadata = Get-Content fixture/inputs/test.json -Raw | ConvertFrom-Json
          ./scripts/installer/test_standard_user.ps1 -Namespace $metadata.namespace -FirstBuild fixture/inputs/first -ReportDirectory standard-user-result -DisposableRunner
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-lifecycle-evidence
          path: |
            offline-setup-result/
            lifecycle-result/
            standard-user-result/
          retention-days: 14
