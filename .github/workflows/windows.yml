name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Run full software checks, test Setup, or warm only the master OpenRGB cache
        required: true
        default: software
        type: choice
        options: [software, setup, openrgb]
      installer_version:
        description: Four-part Windows candidate version, or auto for the next revision of Stable
        required: true
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    if: >-
      github.event_name != 'push' || github.ref_type != 'tag' ||
      (github.repository_id == '1450402221' && github.event.created && !github.event.deleted)
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.release.outputs.version }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the release tag and green master commit
        id: release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = ./scripts/installer/verify_release_tag.ps1 -Tag $env:GITHUB_REF_NAME -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag_object=$($release.TagObject)" >> $env:GITHUB_OUTPUT
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check embedded editor commands
        run: |
          node --check src/ui/windows/web/app.js
          node tests/native_ui_ipc.cjs
      - name: Check the OpenRGB cache contract
        run: python scripts/test_openrgb_cache.py
      - name: Check pinned Setup downloads
        run: python scripts/test_pinned_setup_download.py
      - name: Check release packaging boundaries
        run: python scripts/test_package_release.py
      - name: Check stable release tag verification
        shell: pwsh
        run: ./scripts/installer/test_release_tag.ps1
      - name: Check Inno source when installer inputs change
        if: github.event_name == 'pull_request'
        run: |
          # Checkout uses the PR merge commit, whose first parent is the base.
          $paths = @(
            ':(glob)scripts/installer/*.iss'
            'scripts/installer/prerequisites.lock.json'
            'scripts/package_installer.py'
            'scripts/build_windows_candidate.py'
            'scripts/check_inno_source.py'
            'scripts/pinned_setup_download.py'
            '.github/workflows/windows.yml'
          )
          $changed = git diff --name-only HEAD^1 HEAD -- $paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed) { python scripts/check_inno_source.py }

  software:
    name: Full software checks
    if: >-
      needs.quick.outputs.release_version != '' ||
      (github.event_name == 'workflow_dispatch' && (inputs.validation == 'software' || inputs.validation == 'setup'))
    needs: quick
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check installer packaging boundaries
        run: python scripts/test_package_installer.py
      - name: Test native installer policy checks
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo fmt --manifest-path scripts/installer/policy-tool/Cargo.toml -- --check
          cargo test --locked --manifest-path scripts/installer/policy-tool/Cargo.toml --target x86_64-pc-windows-msvc
          cargo clippy --locked --manifest-path scripts/installer/policy-tool/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Exercise native policy provisioning on the disposable runner
        if: >-
          github.repository_id == '1450402221' && runner.environment == 'github-hosted' &&
          (needs.quick.outputs.release_version != '' ||
           (github.event_name == 'workflow_dispatch' && inputs.validation == 'setup'))
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $env:PRISMESTRA_POLICY_FIXTURE_SID = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          cargo test --locked --manifest-path scripts/installer/policy-tool/Cargo.toml --target x86_64-pc-windows-msvc -- --ignored hosted_provisioning_fixture
      - name: Check legacy startup retirement without system changes
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/installer/test_legacy_startup.ps1
      - name: Check portable launchers without hardware
        run: python scripts/test_portable_launcher.py
      - name: Check shell acceptance evidence
        run: python scripts/test_shell_acceptance.py
      - name: Check local backend configuration without hardware
        run: python scripts/test_backend_setup.py
      - name: Check helper clock contract without hardware
        run: python scripts/test_helper_clock.py
      - name: Check component inventory gates without executing hardware code
        run: python scripts/components/test_verify_openrgb_component.py
      - name: Check component packaging without executing binaries
        run: python scripts/components/test_package_openrgb_component.py
      - name: Test without physical devices
        run: cargo test --locked -- --test-threads=1
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  package:
    name: ${{ inputs.validation == 'openrgb' && 'Warm OpenRGB component cache' || 'Build Windows Setup candidate' }}
    needs: quick
    if: >-
      github.repository_id == '1450402221' &&
      (needs.quick.outputs.release_version != '' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.validation == 'setup' ||
         (inputs.validation == 'openrgb' && github.ref == 'refs/heads/master' &&
          github.event.repository.default_branch == 'master'))))
    permissions:
      contents: read
      actions: read
    # VS 2022 keeps linker output within the pinned VC runtime floor.
    runs-on: windows-2022
    timeout-minutes: 65
    outputs:
      candidate: ${{ steps.build.outputs.candidate }}
      fixtures: ${{ steps.build.outputs.fixtures }}
      sums_sha256: ${{ steps.build.outputs.sums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the pinned OpenRGB source
        run: git submodule update --init --depth 1 -- components/openrgb/upstream
      - name: Select Visual Studio 2022
        id: msvc
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsdevcmd = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find Common7/Tools/VsDevCmd.bat
          if ($LASTEXITCODE -ne 0 -or -not $vsdevcmd) { throw 'MSVC build tools were not found' }
          "vsdevcmd=$vsdevcmd" >> $env:GITHUB_OUTPUT
      - name: Check Setup version against the published stable baseline
        id: setup-version
        if: needs.quick.outputs.release_version != '' || inputs.validation == 'setup'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_INSTALLER_VERSION: ${{ needs.quick.outputs.release_version || inputs.installer_version }}
        run: |
          $pin = Get-Content -LiteralPath scripts/installer/stable-upgrade-baseline.lock.json -Raw | ConvertFrom-Json
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -cnotmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Could not identify the published stable release.'
          }
          $stableCore = $latest.tag_name.Substring(1)
          $stableVersion = "$stableCore.0"
          $asset = @($latest.assets | Where-Object name -CEQ $pin.file)
          if ($pin.version -cne $stableVersion -or $asset.Count -ne 1 -or $asset[0].state -cne 'uploaded' -or
              $asset[0].digest -cne "sha256:$($pin.sha256)" -or $asset[0].size -ne $pin.size -or
              $asset[0].browser_download_url -cne $pin.source) {
            throw 'Update the stable upgrade baseline pin to the current published Setup.'
          }
          $version = $env:REQUESTED_INSTALLER_VERSION
          if ($version -ceq 'auto') { $version = "$stableCore.1" }
          if ($version -cnotmatch '^\d+\.\d+\.\d+\.\d+$' -or
              [version]$version -le [version]$stableVersion) {
            throw "Setup version must be newer than the published stable version $stableVersion."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Fingerprint the OpenRGB build environment
        id: openrgb
        if: >-
          github.event.repository.default_branch == 'master' && runner.environment == 'github-hosted' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        shell: pwsh
        env:
          VSDEVCMD: ${{ steps.msvc.outputs.vsdevcmd }}
        run: ./scripts/components/openrgb_cache_key.ps1
      - name: Check release cache scope
        id: release-cache
        if: startsWith(github.ref, 'refs/tags/v') && steps.openrgb.outputs.key != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OPENRGB_KEY: ${{ steps.openrgb.outputs.key }}
        run: |
          # GitHub searches the current ref first. Skip a potentially shadowed master entry.
          $route = "repos/$env:GITHUB_REPOSITORY/actions/caches"
          $tag = gh api --method GET $route -f "ref=$env:GITHUB_REF" -f "key=$env:OPENRGB_KEY" --jq .total_count
          if ($LASTEXITCODE -ne 0 -or $tag -cnotmatch '^\d+$') { throw 'Could not verify tag cache scope' }
          $master = gh api --method GET $route -f 'ref=refs/heads/master' -f "key=$env:OPENRGB_KEY" --jq '.actions_caches[].key'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify master cache scope' }
          if ($tag -ceq '0' -and @($master) -ccontains $env:OPENRGB_KEY) {
            'master_entry=true' >> $env:GITHUB_OUTPUT
          }
      - name: Restore verified OpenRGB component
        id: openrgb-restore
        if: >-
          steps.openrgb.outputs.key != '' &&
          (github.ref == 'refs/heads/master' || steps.release-cache.outputs.master_entry == 'true')
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/prismestra-openrgb-cache
          key: ${{ steps.openrgb.outputs.key }}
      - name: Build the installer and lifecycle inputs
        id: build
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.setup-version.outputs.version }}
          VSDEVCMD: ${{ steps.msvc.outputs.vsdevcmd }}
          OPENRGB_CACHE_KEY: ${{ steps.openrgb.outputs.key }}
          OPENRGB_ONLY: ${{ inputs.validation == 'openrgb' }}
          OPENRGB_WRITE: ${{ github.ref == 'refs/heads/master' && runner.environment == 'github-hosted' }}
          OPENRGB_HIT: ${{ steps.openrgb-restore.outputs.cache-hit }}
          PRISMESTRA_VC_REDIST_X64_URL: ${{ vars.PRISMESTRA_VC_REDIST_X64_URL }}
          PRISMESTRA_WEBVIEW2_X64_URL: ${{ vars.PRISMESTRA_WEBVIEW2_X64_URL }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP prismestra-candidate
          $cacheArgs = @()
          if ($env:OPENRGB_CACHE_KEY -and ($env:OPENRGB_WRITE -ceq 'true' -or $env:OPENRGB_HIT -ceq 'true')) {
            $cacheArgs = @('--openrgb-cache', (Join-Path $env:RUNNER_TEMP 'prismestra-openrgb-cache'), '--openrgb-cache-key', $env:OPENRGB_CACHE_KEY)
            if ($env:OPENRGB_WRITE -ceq 'true') { $cacheArgs += '--write-openrgb-cache' }
          }
          if ($env:OPENRGB_ONLY -ceq 'true') {
            if (!$cacheArgs.Count) { throw 'Warm-up requires a fingerprinted hosted master runner' }
            python scripts/build_windows_candidate.py --commit $env:GITHUB_SHA --vsdevcmd $env:VSDEVCMD --output $output --openrgb-only @cacheArgs
            if ($LASTEXITCODE -ne 0) { throw 'OpenRGB cache warm-up failed' }
            "openrgb_cache_ready=$(Test-Path -LiteralPath (Join-Path $output 'openrgb-cache-ready') -PathType Leaf)" >> $env:GITHUB_OUTPUT
            return
          }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE) { throw 'Installing the candidate Rust toolchain failed' }
          $env:RUSTUP_TOOLCHAIN = '1.99.1'
          python scripts/build_windows_candidate.py --commit $env:GITHUB_SHA --version $env:INSTALLER_VERSION --vsdevcmd $env:VSDEVCMD --output $output @cacheArgs
          if ($LASTEXITCODE) { throw 'Building the Windows candidate failed' }
          "candidate=prismestra-compiled-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "fixtures=prismestra-lifecycle-inputs-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "sums_sha256=$((Get-FileHash (Join-Path $output 'candidate/SHA256SUMS.txt')).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "openrgb_cache_ready=$(Test-Path -LiteralPath (Join-Path $output 'openrgb-cache-ready') -PathType Leaf)" >> $env:GITHUB_OUTPUT
      - name: Save verified OpenRGB component
        if: >-
          github.ref == 'refs/heads/master' && runner.environment == 'github-hosted' &&
          steps.openrgb.outputs.key != '' && steps.build.outputs.openrgb_cache_ready == 'True'
        continue-on-error: ${{ inputs.validation != 'openrgb' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/prismestra-openrgb-cache
          key: ${{ steps.openrgb.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' || inputs.validation == 'setup'
        with:
          name: ${{ steps.build.outputs.candidate }}
          path: ${{ runner.temp }}/prismestra-candidate/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' || inputs.validation == 'setup'
        with:
          name: ${{ steps.build.outputs.fixtures }}
          path: ${{ runner.temp }}/prismestra-candidate/fixtures/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the matching portable ZIP for QA
        if: github.event_name == 'push' || inputs.validation == 'setup'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prismestra-portable-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prismestra-candidate/portable/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain component build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-build-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prismestra-candidate/openrgb-build/*.log
            ${{ runner.temp }}/prismestra-candidate/openrgb-inventory.json
            ${{ runner.temp }}/prismestra-candidate/component-parent-smoke/
          retention-days: 14

  installer:
    name: Windows lifecycle (${{ matrix.test }})
    needs: package
    if: github.event_name == 'push' || inputs.validation == 'setup'
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [offline-setup, standard-user, first-scene-one-ddp, first-scene-two-ddp, production-upgrade, stable-upgrade, upgrade-fixtures]
        include:
          - test: standard-user
            ddp_devices: 0
          - test: first-scene-one-ddp
            ddp_devices: 1
          - test: first-scene-two-ddp
            ddp_devices: 2
          - test: production-upgrade
            upgrade_from: Preview
          - test: stable-upgrade
            upgrade_from: Stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.test != 'upgrade-fixtures'
        with:
          name: ${{ needs.package.outputs.candidate }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.test == 'upgrade-fixtures' || matrix.test == 'standard-user' || matrix.ddp_devices > 0 || matrix.upgrade_from != null
        with:
          name: ${{ needs.package.outputs.fixtures }}
          path: ${{ runner.temp }}/fixtures
      - name: Exercise setup and uninstall
        if: matrix.test == 'offline-setup'
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums_sha256 }}
        run: |
          $candidate = ./scripts/installer/verify_candidate.ps1 -Directory (Join-Path $env:RUNNER_TEMP candidate) -Commit $env:GITHUB_SHA -SumsSha256 $env:SUMS_SHA256
          ./scripts/installer/test_offline_setup.ps1 -Installer $candidate.Setup -Sha256 $candidate.SetupSha256 -Commit $env:GITHUB_SHA -ManifestSha256 $candidate.ManifestSha256 -ReportDirectory evidence -DisposableRunner
      - name: Upgrade the published Setup to this candidate
        if: matrix.upgrade_from != null
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums_sha256 }}
          UPGRADE_FROM: ${{ matrix.upgrade_from }}
        run: |
          $candidate = ./scripts/installer/verify_candidate.ps1 -Directory (Join-Path $env:RUNNER_TEMP candidate) -Commit $env:GITHUB_SHA -SumsSha256 $env:SUMS_SHA256
          $baselineLock = if ($env:UPGRADE_FROM -ceq 'Stable') { 'stable-upgrade-baseline.lock.json' } else { 'upgrade-baseline.lock.json' }
          $baseline = Get-Content -LiteralPath (Join-Path scripts/installer $baselineLock) -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'candidate/install-manifest.json') -Raw | ConvertFrom-Json
          if ([version]$manifest.installer_version -le [version]$baseline.version) {
            throw 'The candidate installer version must exceed the published upgrade baseline.'
          }
          $previous = Join-Path $env:RUNNER_TEMP $baseline.file
          Invoke-WebRequest -Uri $baseline.source -OutFile $previous -TimeoutSec 180
          $fixtures = Join-Path $env:RUNNER_TEMP fixtures
          $routeProbeSha = (Get-Content -LiteralPath (Join-Path $fixtures 'upgrade-routes.sha256') -Raw).Trim()
          ./scripts/installer/test_offline_setup.ps1 -PreviousInstaller $previous -UpgradeFrom $env:UPGRADE_FROM -Installer $candidate.Setup -Sha256 $candidate.SetupSha256 -Commit $env:GITHUB_SHA -ManifestSha256 $candidate.ManifestSha256 -ReportDirectory evidence -UpgradeRouteProbe (Join-Path $fixtures 'setup_upgrade_routes.exe') -UpgradeRouteProbeSha256 $routeProbeSha -DisposableRunner
          ./scripts/installer/verify_upgrade_receipts.ps1 -Directory evidence -Commit $env:GITHUB_SHA -SetupSha256 $candidate.SetupSha256 -ManifestSha256 $candidate.ManifestSha256 -ProbeSha256 $routeProbeSha
      - name: Launch the same Setup payload as a fresh standard user
        if: matrix.test == 'standard-user' || matrix.ddp_devices > 0
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums_sha256 }}
          DDP_DEVICES: ${{ matrix.ddp_devices }}
        run: |
          $candidate = ./scripts/installer/verify_candidate.ps1 -Directory (Join-Path $env:RUNNER_TEMP candidate) -Commit $env:GITHUB_SHA -SumsSha256 $env:SUMS_SHA256
          $fixtures = Join-Path $env:RUNNER_TEMP fixtures
          $probeSha = (Get-Content -LiteralPath (Join-Path $fixtures 'webview-probe.sha256') -Raw).Trim()
          ./scripts/installer/test_standard_user.ps1 -Installer $candidate.Setup -InstallerSha256 $candidate.SetupSha256 -ManifestSha256 $candidate.ManifestSha256 -Commit $env:GITHUB_SHA -ReportDirectory evidence -WebViewProbe (Join-Path $fixtures 'Prismestra-Setup-Probe.exe') -WebViewProbeSha256 $probeSha -DdpDevices ([int]$env:DDP_DEVICES) -DisposableRunner
      - name: Exercise repair, upgrade and retention in an isolated namespace
        if: matrix.test == 'upgrade-fixtures'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP fixtures
          $namespace = [guid](Get-Content -LiteralPath (Join-Path $root namespace.txt) -Raw).Trim()
          foreach ($name in 'first', 'upgrade') {
            $manifest = Get-Content -LiteralPath (Join-Path $root "$name/stage/payload/install-manifest.json") -Raw | ConvertFrom-Json
            if ($manifest.commit -cne $env:GITHUB_SHA -or $manifest.data_namespace -cne $namespace.ToString('D')) {
              throw "Lifecycle $name fixture differs from this run's commit or namespace"
            }
          }
          ./scripts/installer/test_lifecycle.ps1 -Namespace $namespace -FirstBuild (Join-Path $root first) -UpgradeBuild (Join-Path $root upgrade) -ReportDirectory evidence -ElevatedFilesOnly
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-${{ matrix.test }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14

  candidate:
    name: Retain verified Windows candidate
    needs: [software, package, installer]
    if: github.event_name == 'workflow_dispatch' && inputs.validation == 'setup'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package.outputs.candidate }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the tested bytes
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums_sha256 }}
        run: |
          $candidate = ./scripts/installer/verify_candidate.ps1 -Directory (Join-Path $env:RUNNER_TEMP candidate) -Commit $env:GITHUB_SHA -SumsSha256 $env:SUMS_SHA256
          "Setup SHA-256: $($candidate.SetupSha256)" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prismestra-verified-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the tested Windows Setup
    needs: [quick, software, package, installer]
    if: >-
      github.repository_id == '1450402221' && github.event_name == 'push' &&
      github.ref_type == 'tag' && needs.quick.outputs.tag_object != ''
    concurrency:
      group: publish-stable-release
      queue: max
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package.outputs.candidate }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the tag and publish the exact tested files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS_SHA256: ${{ needs.package.outputs.sums_sha256 }}
          TAG_OBJECT: ${{ needs.quick.outputs.tag_object }}
        run: |
          ./scripts/installer/publish_release.ps1 -Directory (Join-Path $env:RUNNER_TEMP candidate) -Tag $env:GITHUB_REF_NAME -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -TagObject $env:TAG_OBJECT -SumsSha256 $env:SUMS_SHA256 -RunId $env:GITHUB_RUN_ID
