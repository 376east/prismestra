<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your device and see which lighting and display features Prismestra can use.">
  <title>Find your device · Prismestra</title>
  <link rel="stylesheet" href="lookup.css">
  <script src="lookup.mjs" type="module"></script>
</head>
<body>
  <main>
    <nav aria-label="Project">
      <a href="https://github.com/376east/prismestra">Prismestra</a>
      <span class="nav-links">
        <a id="download" href="https://github.com/376east/prismestra/releases/latest">Download for Windows</a>
        <a id="language" href="?lang=ru" hreflang="ru" lang="ru">Русский</a>
      </span>
    </nav>
    <header>
      <h1 id="title">Find your device</h1>
      <p id="intro">Search by model, device type or USB ID.</p>
    </header>
    <form id="filters" role="search">
      <div class="query">
        <label for="query" id="query-label">Device</label>
        <input id="query" name="q" type="search" placeholder="Surplife E1, keyboard, 264A:233C…" autocomplete="off">
      </div>
      <div>
        <label for="filter" id="filter-label">Filter</label>
        <select id="filter" name="filter">
          <option value="">All devices</option>
        </select>
      </div>
    </form>
    <div id="examples" class="examples" hidden></div>
    <p id="count" role="status">Loading devices…</p>
    <ul id="results" class="results" aria-label="Matching devices"></ul>
    <button id="more" type="button" hidden>Show more</button>
    <noscript><p>JavaScript is required for search. See the <a href="https://github.com/376east/prismestra/blob/master/docs/compatibility.md">compatibility guide</a>.</p></noscript>
    <footer>
      <a id="report" href="https://github.com/376east/prismestra/issues/new?template=device.yml">Report a device</a>
      <a id="guide" href="https://github.com/376east/prismestra/blob/master/docs/compatibility.md">Compatibility guide</a>
      <details>
        <summary id="catalog-label">About the catalog</summary>
        <p id="provenance"></p>
        <a id="upstream" href="https://openrgb.org/devices_pipeline.html">OpenRGB development catalog</a>
      </details>
    </footer>
  </main>
</body>
</html>
